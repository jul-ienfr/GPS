    cell_voltage_4:  {name: "BMS Cell Voltage 4",  icon: "mdi:battery-outline"}
    cell_voltage_5:  {name: "BMS Cell Voltage 5",  icon: "mdi:battery-outline"}
    cell_voltage_6:  {name: "BMS Cell Voltage 6",  icon: "mdi:battery-outline"}
    cell_voltage_7:  {name: "BMS Cell Voltage 7",  icon: "mdi:battery-outline"}
    cell_voltage_8:  {name: "BMS Cell Voltage 8",  icon: "mdi:battery-outline"}

# =============================================================================
#  LOGIQUE D'ENVOI GPS (throttle dynamique)
# =============================================================================
interval:
  - interval: 1s
    then:
      - lambda: |-
          // GPS hors tension (mode éco ou interrupteur HA) : on ne publie rien.
          if (!id(gps_power_switch).state) return;

          if (std::isnan(id(int_lat).state)) return;
          if (std::isnan(id(int_lon).state)) return;

          // Garde qualité : jette les fixes pourris (c'est eux qui font les
          // grandes lignes droites à 200 m sur la carte Traccar).
          // HDOP > 2.5 ou moins de 4 satellites = position inexploitable.
          if (!std::isnan(id(int_hdop).state) && id(int_hdop).state > 2.5f) return;
          if (!std::isnan(id(int_sats).state) && id(int_sats).state < 4.0f) return;

          float speed = std::isnan(id(int_speed).state) ? 0.0f : id(int_speed).state;

          // Distance depuis la dernière position publiée (haversine, mètres).
          float dist_m = NAN;
          if (!std::isnan(id(last_pub_lat)) && !std::isnan(id(last_pub_lon))) {
            float lat1 = id(last_pub_lat) * 0.01745329252f;
            float lat2 = id(int_lat).state * 0.01745329252f;
            float dlat = lat2 - lat1;
            float dlon = (id(int_lon).state - id(last_pub_lon)) * 0.01745329252f;
            float a = sinf(dlat * 0.5f) * sinf(dlat * 0.5f)
                    + cosf(lat1) * cosf(lat2) * sinf(dlon * 0.5f) * sinf(dlon * 0.5f);
            dist_m = 2.0f * 6371000.0f * asinf(sqrtf(a));
          }

          uint32_t now_ms = esphome::millis();
          uint32_t min_interval;

          if (id(debug_mode)) {
            // Debug : 1 s, pas de throttling
            min_interval = 1000;
          } else if (speed > 4.0f && (std::isnan(dist_m) || dist_m >= 10.0f)) {
            // EN MOUVEMENT : suivi quasi instantané.
            // Double condition vitesse + distance : une vitesse fantôme du
            // Neo-6M à l'arrêt (3-5 km/h) ne déplace pas la position de 10 m,
            // donc elle retombe dans la branche arrêt ci-dessous.
            // `gps_interval` = cadence en mouvement, réglable dans HA
            // (défaut 3 s).
            min_interval = (uint32_t) (id(gps_interval).state * 1000);
          } else {
            // À L'ARRÊT : heartbeat fixe toutes les 15 min, rien d'autre.
            // Première position après un fix : on publie toujours.
            if (std::isnan(dist_m)) {
              min_interval = (uint32_t) (id(gps_interval).state * 1000);
            } else if (dist_m < 25.0f) {
              // Jitter autour du point : silence radio sauf heartbeat.
              if (now_ms - id(last_gps_update) < 900000) return;  // 15 min
              min_interval = 900000;
            } else {
              // > 25 m parcourus à vitesse faible (poussée à la main,
              // remorquage, sortie de parking au pas) : on publie, au
              // maximum toutes les 60 s.
              min_interval = 60000;
            }
            // Mode éco : on force au moins 60 s entre deux publications
            if (id(ha_eco_mode).state && min_interval < 60000) {
              min_interval = 60000;
            }
          }

          // `esphome::` explicite : le composant GPS tire aussi un `millis()`
          // global (TinyGPS++), d'où un appel ambigu sous esp-idf.
          if (now_ms - id(last_gps_update) < min_interval) return;

          if (!std::isnan(id(int_lat).state))   id(public_lat).publish_state(id(int_lat).state);
          if (!std::isnan(id(int_lon).state))   id(public_lon).publish_state(id(int_lon).state);
          if (!std::isnan(id(int_alt).state))   id(public_alt).publish_state(id(int_alt).state);
          if (!std::isnan(id(int_speed).state)) id(public_speed).publish_state(id(int_speed).state);
          if (!std::isnan(id(int_sats).state))  id(public_sats).publish_state(id(int_sats).state);
          if (!std::isnan(id(int_hdop).state))  id(public_hdop).publish_state(id(int_hdop).state);
          if (!std::isnan(id(int_course).state)) id(public_course).publish_state(id(int_course).state);

          id(last_pub_lat) = id(int_lat).state;
          id(last_pub_lon) = id(int_lon).state;
          id(last_gps_update) = esphome::millis();
