    name: "Van Latitude"
    id: public_lat
    accuracy_decimals: 6
    icon: "mdi:latitude"

  - platform: template
    name: "Van Longitude"
    id: public_lon
    accuracy_decimals: 6
    icon: "mdi:longitude"

  - platform: template
    name: "Van Altitude"
    id: public_alt
    unit_of_measurement: "m"
    accuracy_decimals: 1
    icon: "mdi:altimeter"

  - platform: template
    name: "Van Speed"
    id: public_speed
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    icon: "mdi:speedometer"

  - platform: template
    name: "GPS Satellites"
    id: public_sats
    accuracy_decimals: 0
    icon: "mdi:satellite-variant"

  - platform: template
    name: "GPS HDOP"
    id: public_hdop
    accuracy_decimals: 2
    icon: "mdi:crosshairs-gps"

  - platform: template
    name: "GPS Direction"
    id: public_course
    unit_of_measurement: "°"
    accuracy_decimals: 0
    icon: "mdi:compass"

  # --- GPS : diagnostic ----------------------------------------------------
  - platform: uptime
    name: "GPS Uptime"
    icon: "mdi:clock-outline"

  - platform: wifi_signal
    name: "GPS WiFi Signal"
    id: wifi_signal_sensor
    icon: "mdi:wifi"
    update_interval: 10s

  # Mémoire libre via le composant natif `debug` : `ESP.getFreeHeap()`
  # n'existe que sous Arduino et ne compile pas sous esp-idf.
  - platform: debug
    free:
      name: "GPS Free Heap"
      id: free_heap_sensor
      icon: "mdi:memory"
      unit_of_measurement: "kB"
      filters:
        - lambda: return x / 1024.0;

  # --- JK BMS : valeurs principales ---------------------------------------
  # Sélection volontairement courte (voir syssi/esphome-jk-bms#63 : activer
  # tous les capteurs d'un coup peut faire déborder la pile).
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0

    total_voltage:
      name: "BMS Total Voltage"
      id: bms_total_voltage
      icon: "mdi:flash"
    current:
      name: "BMS Current"
      id: bms_current
      icon: "mdi:current-dc"
    power:
      name: "BMS Power"
      icon: "mdi:flash-outline"
    state_of_charge:
      name: "BMS State of Charge"
      id: bms_soc
      icon: "mdi:battery-70"
    capacity_remaining:
      name: "BMS Capacity Remaining"
      icon: "mdi:battery-outline"
    full_charge_capacity:
      name: "BMS Full Charge Capacity"
      icon: "mdi:battery"

    # Équilibrage des cellules — c'est ce qui indique un déséquilibre
    min_cell_voltage:
      name: "BMS Min Cell Voltage"
      icon: "mdi:battery-low"
    max_cell_voltage:
      name: "BMS Max Cell Voltage"
      icon: "mdi:battery-high"
    delta_cell_voltage:
      name: "BMS Delta Cell Voltage"
      icon: "mdi:delta"
    average_cell_voltage:
      name: "BMS Average Cell Voltage"
      icon: "mdi:battery-sync"

    # Températures
    temperature_sensor_1:
      name: "BMS Temperature 1"
      icon: "mdi:thermometer"
    temperature_sensor_2:
      name: "BMS Temperature 2"
      icon: "mdi:thermometer"
    mosfet_temperature:
      name: "BMS MOSFET Temperature"
      icon: "mdi:thermometer-lines"

    balancing_current:
      name: "BMS Balancing Current"
      icon: "mdi:battery-heart-variant"

    # Compteurs
    charging_cycles:
      name: "BMS Charging Cycles"
      icon: "mdi:counter"
    total_charging_cycle_capacity:
      name: "BMS Total Cycle Capacity"
      icon: "mdi:counter"
    total_runtime:
      name: "BMS Total Runtime Hours"
      icon: "mdi:clock-outline"

  # --- JK BMS : tensions de cellule (pack 8S) --------------------------------
  # Réglé pour 8 cellules. Si vous ajoutez/supprimez des cellules, ajustez ici
  # et dans le dashboard.
  # Hors stack : 8 capteurs ne posent aucun problème (la pile est de toute
  # façon montée à 8192 octets en haut de ce fichier — voir issue #63).
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    cell_voltage_1:  {name: "BMS Cell Voltage 1",  icon: "mdi:battery-outline"}
    cell_voltage_2:  {name: "BMS Cell Voltage 2",  icon: "mdi:battery-outline"}
